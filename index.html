<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
  <link rel="manifest" href="favicons/site.webmanifest">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="sidebar" class="sidebar minimised">
    <div class="sidebar-handle">
      <span class="sidebar-caret"></span>
    </div>
    <div class="sidebar-content"></div>
  </div>
  <div class="top-right" id="top-right"></div>

  <div class="clock" id="clock">--:--</div>
  <div class="weather" id="weather">Fetching weather...</div>
  <div class="quote" id="quote"></div>
  <div class="shortcuts" id="shortcuts"></div>

  <div class="customize" id="customize" title="Customize Settings">
    <span class="customize-icon"><svg fill="currentColor" width="20px" height="20px" viewBox="-1 0 44 44"><path id="_45.Settings" data-name="45.Settings" d="M35,22H13A10,10,0,0,1,13,2H35a10,10,0,0,1,0,20ZM35,4H13a8,8,0,0,0,0,16H35A8,8,0,0,0,35,4ZM13,18a6,6,0,1,1,6-6A6,6,0,0,1,13,18ZM13,8a4,4,0,1,0,4,4A4,4,0,0,0,13,8Zm0,18H35a10,10,0,0,1,0,20H13a10,10,0,0,1,0-20Zm0,18H35a8,8,0,0,0,0-16H13a8,8,0,0,0,0,16ZM35,30a6,6,0,1,1-6,6A6,6,0,0,1,35,30Zm0,10a4,4,0,1,0-4-4A4,4,0,0,0,35,40Z" transform="translate(-3 -2)" fill-rule="evenodd"/></svg></span>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <iframe id="settings-iframe"></iframe>
  </div>
  <div class="photo-credit" id="photo-credit" style="display: none;">
    Photo by <a id="photo-credit-link" target="_blank" rel="noopener noreferrer"></a> on <a
      href="https://unsplash.com/?utm_source=minimal_new_tab&utm_medium=referral" target="_blank"
      rel="noopener noreferrer">Unsplash</a>
    <span class="refresh-background" id="refresh-background" title="Get new background" style="display: none;"><span
        class="refresh-icon"></span></span>
  <div class="art-grid"></div>
  <script src="defaultSettings.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="art.js"></script>
  <script type="module" src="widgets/calendar.js"></script>
  <script type="module" src="widgets/todo.js"></script>
  <script type="module" src="widgets/pomodoro.js"></script>
  <script type="module" src="widgets/notes.js"></script>
  <script type="module" src="canvas-bg.js"></script>
  <script type="module" src="pet.js"></script>
</body>

</html>
